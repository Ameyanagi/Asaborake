[workspace]
resolver = "3"
members = [
    "crates/asaborake-ts",
    "crates/asaborake-media",
    "crates/asaborake-analyze",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Ryuichi Shimoyama <ryuichi@ameyanagi.com>"]
repository = "https://github.com/Ameyanagi/Asaborake"
description = "Automatic CM cutting and transcoding for Japanese broadcast MPEG-2 TS. Heavily inspired by nekopanda's Amatsukaze."
keywords = ["mpeg2ts", "epgstation", "transcode", "commercial-detection"]
categories = ["multimedia::video"]

[workspace.dependencies]
asaborake-ts = { path = "crates/asaborake-ts", version = "0.1.0" }
asaborake-media = { path = "crates/asaborake-media", version = "0.1.0" }
asaborake-analyze = { path = "crates/asaborake-analyze", version = "0.1.0" }
asaborake-cmcut = { path = "crates/asaborake-cmcut", version = "0.1.0" }
asaborake-core = { path = "crates/asaborake-core", version = "0.1.0" }
asaborake-server = { path = "crates/asaborake-server", version = "0.1.0" }

anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "chrono", "macros", "migrate"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

approx = "0.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Fallible conversions and panics are worth being explicit about in a pipeline
# that runs unattended overnight against whatever the tuner produced.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# The bitstream parsers index deliberately, immediately after an explicit
# length check; `.get()` on every one of those would obscure the logic rather
# than protect it.
indexing_slicing = "allow"

# The signal-processing code converts between integer sample types and f64
# constantly. These fire on every such conversion without distinguishing the
# correct ones from the lossy ones, so they are handled by review instead.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Asaborake's public types are plain data crossing a JSON boundary; requiring
# every field to be documented is useful, requiring `# Errors` prose on every
# `Result`-returning private helper is not.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Struct-per-argument refactors do not make an ffmpeg command builder clearer.
too_many_arguments = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Analysis passes are unusably slow in a debug build; a 20-minute recording
# takes minutes rather than hours with the dependencies optimised.
[profile.dev.package."*"]
opt-level = 2
