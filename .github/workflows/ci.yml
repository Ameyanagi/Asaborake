name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The analysis and encode tests drive ffmpeg as a subprocess and generate
      # their own synthetic TS material, so no broadcast recordings are needed.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The web app lands after the engine, so this job has to stay green on a
      # tree that does not contain it yet.
      - id: probe
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/ is not present yet; skipping web checks"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.probe.outputs.present == 'true'
        with:
          bun-version: latest

      - if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: bun install --frozen-lockfile

      - if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: bun run typecheck

      - if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: bun run lint
